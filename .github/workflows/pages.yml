name: Publish FocusEnglish

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: focusenglish-pages
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Check verified transfer behavior
        run: python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Prepare exact website snapshot
        run: python3 scripts/materialize_site.py --config deploy/assets.json --output site
      - name: Retain website in this repository
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add site/
          if ! git diff --cached --quiet; then
            git commit -m 'Import verified FocusEnglish website'
            git push origin HEAD:main
          fi
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Deploy verified website
        id: deployment
        uses: actions/deploy-pages@v5
